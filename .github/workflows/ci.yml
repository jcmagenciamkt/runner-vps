name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    # Repositório público: minutos ilimitados nos runners do GitHub.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning *.sh testes/*.sh
      - name: testes
        run: testes/rodar.sh
